<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="質問と添削で、毎日の学習をサポートするAI学習チャットです。">
<title>AI学習チャット</title>
<style>
:root{
  color-scheme:light;
  --ink:#172033;
  --muted:#667085;
  --line:#e5eaf2;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --surface:#fff;
  --page:#f5f7fb;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;background:var(--page);color:var(--ink)}
body{min-height:100dvh}
main{width:min(900px,calc(100% - 40px));min-height:100dvh;margin:auto;display:flex;flex-direction:column;justify-content:center;padding:56px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--blue);margin:0 0 14px}
h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.04em;line-height:1.25;margin:0}
.lead{font-size:15px;line-height:1.9;color:var(--muted);margin:16px 0 34px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choice{position:relative;display:flex;flex-direction:column;min-height:190px;padding:25px 24px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:inherit;text-decoration:none;transition:border-color .18s,box-shadow .18s,transform .18s}
.choice:hover{border-color:#b7cdfc;box-shadow:0 12px 32px rgba(31,65,120,.08);transform:translateY(-2px)}
.choice:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
.choice-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
.choice h2{font-size:22px;margin:12px 0 8px}
.choice p{font-size:14px;line-height:1.8;color:var(--muted);margin:0}
.arrow{margin-top:auto;padding-top:20px;color:var(--blue);font-size:14px;font-weight:700}
footer{margin-top:42px;color:#98a2b3;font-size:12px}
@media(max-width:620px){
  main{width:min(100% - 32px,460px);padding:44px 0}
  .choices{grid-template-columns:1fr;gap:12px}
  .choice{min-height:160px;padding:21px}
  .lead{margin-bottom:25px}
  footer{margin-top:28px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">STUDY SUPPORT</p>
  <h1>学習を、もっと分かりやすく。</h1>
  <p class="lead">質問や答案の添削を通して、毎日の学習をサポートします。目的に合わせて機能を選んでください。</p>
  <nav class="choices" aria-label="学習メニュー">
    <a class="choice" href="/question.html">
      <span class="choice-label">ASK</span>
      <h2>質問する</h2>
      <p>分からない問題や学習内容を、教科ごとに質問できます。</p>
      <span class="arrow">質問を始める →</span>
    </a>
    <a class="choice" href="/correction.html">
      <span class="choice-label">REVIEW</span>
      <h2>添削する</h2>
      <p>答案・ノート・作文などを送信して、改善点を確認できます。</p>
      <span class="arrow">添削を始める →</span>
    </a>
  </nav>
  <footer>AI学習チャット</footer>
</main>
</body>
</html>
