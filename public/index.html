<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>AI学習チャット</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
      background: #f7f7f8;
      color: #222;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;
    }

    .screen.active {
      display: flex;
    }

    /* =========================
       START
    ========================= */

    #startScreen {
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .start-container {
      width: min(430px, 100%);
      text-align: center;
    }

    .app-title {
      margin: 0 0 45px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .mode-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mode-button {
      width: 100%;
      height: 68px;
      border: 1px solid #ddd;
      border-radius: 18px;
      background: #fff;
      color: #222;
      font-size: 20px;
      font-weight: 600;
      transition: transform 0.15s, background 0.15s;
    }

    .mode-button:active {
      transform: scale(0.98);
      background: #f1f1f1;
    }

    /* =========================
       SUBJECT
    ========================= */

    #subjectScreen {
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .subject-container {
      width: min(430px, 100%);
    }

    .screen-title {
      text-align: center;
      font-size: 25px;
      margin: 0 0 28px;
      font-weight: 700;
    }

    .subject-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .subject-button {
      width: 100%;
      height: 58px;
      border: 1px solid #ddd;
      border-radius: 15px;
      background: #fff;
      font-size: 18px;
      color: #222;
    }

    .subject-button:active {
      background: #f0f0f0;
    }

    .back-button {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      font-size: 25px;
    }

    /* =========================
       CHAT
    ========================= */

    #chatScreen {
      flex-direction: column;
      background: #f7f7f8;
    }

    .chat-header {
      position: sticky;
      top: 0;
      z-index: 20;

      height: 64px;

      display: flex;
      align-items: center;

      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #e5e5e5;

      padding: 0 14px;
    }

    .chat-back {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      font-size: 24px;
      margin-right: 5px;
    }

    .chat-title-area {
      flex: 1;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 700;
    }

    .chat-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: #777;
    }

    /* =========================
       CHAT CONTENT
    ========================= */

    .chat-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 170px;
    }

    .messages {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .message {
      display: flex;
      margin: 10px 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
    }

    .message.user .bubble {
      background: #222;
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .message.ai .bubble {
      background: #fff;
      color: #222;
      border: 1px solid #e5e5e5;
      border-bottom-left-radius: 5px;
    }

    /* =========================
       TYPING
    ========================= */

    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      min-width: 55px;
      height: 42px;
      padding: 0 14px !important;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;

      animation:
        softPowa 1.1s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes softPowa {
      0%,
      70%,
      100% {
        transform: scale(0.65);
        opacity: 0.35;
      }

      35% {
        transform: scale(1.45);
        opacity: 1;
      }
    }

    /* =========================
       ATTACHMENT
    ========================= */

    .attachment-area {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 12px;
    }

    .attachment-inner {
      width: min(760px, 100%);
      margin: auto;
    }

    .attachment-preview {
      position: relative;
      margin-bottom: 10px;
      display: none;
    }

    .attachment-preview.show {
      display: block;
    }

    .attachment-preview img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 180px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .remove-image {
      margin-top: 7px;
      padding: 7px 11px;
      border: 0;
      border-radius: 9px;
      background: #eee;
      font-size: 13px;
    }

    .attachment-buttons {
      display: flex;
      gap: 8px;
    }

    .attachment-button {
      padding: 10px 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      background: #fff;
      font-size: 14px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 30;

      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid #ddd;

      padding:
        10px
        max(10px, env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }

    .composer-inner {
      width: min(760px, 100%);
      margin: auto;

      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #questionInput {
      flex: 1;

      min-height: 46px;
      max-height: 140px;

      resize: none;

      border: 1px solid #ccc;
      border-radius: 14px;

      padding: 11px 13px;

      outline: none;

      background: #fff;
      color: #222;

      line-height: 1.5;
    }

    #questionInput:focus {
      border-color: #888;
    }

    #sendButton {
      width: 64px;
      height: 46px;

      border: 0;
      border-radius: 14px;

      background: #222;
      color: #fff;

      font-weight: 600;
    }

    #sendButton:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* =========================
       CROP MODAL
    ========================= */

    #cropModal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.72);

      padding: 15px;
    }

    #cropModal.show {
      display: flex;
    }

    .crop-container {
      width: min(700px, 100%);
      max-height: 95dvh;

      background: #fff;
      border-radius: 18px;

      padding: 16px;

      display: flex;
      flex-direction: column;
    }

    .crop-title {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .crop-stage {
      position: relative;

      width: 100%;
      height: min(65dvh, 540px);

      background: #111;
      border-radius: 12px;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cropImage {
      max-width: 100%;
      max-height: 100%;

      user-select: none;
      -webkit-user-drag: none;
    }

    .crop-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;

      margin-top: 12px;
    }

    .crop-action {
      padding: 11px 14px;

      border: 0;
      border-radius: 11px;

      background: #eee;
    }

    .crop-action.primary {
      background: #222;
      color: #fff;
    }

    /* =========================
       STEP LABEL
    ========================= */

    .step-label {
      display: inline-block;

      margin-bottom: 7px;

      padding: 3px 8px;

      border-radius: 7px;

      background: #f0f0f0;

      color: #666;

      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .app-title {
        font-size: 27px;
      }

      .bubble {
        max-width: 91%;
        font-size: 15px;
      }

      .chat-content {
        padding-left: 9px;
        padding-right: 9px;
      }

      .attachment-buttons {
        width: 100%;
      }

      .attachment-button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       START
  ========================== -->

  <section id="startScreen" class="screen active">

    <div class="start-container">

      <h1 class="app-title">
        AI学習チャット
      </h1>

      <div class="mode-buttons">

        <button
          class="mode-button"
          data-mode="添削"
        >
          添削
        </button>

        <button
          class="mode-button"
          data-mode="質問"
        >
          質問
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       SUBJECT
  ========================== -->

  <section id="subjectScreen" class="screen">

    <button
      id="subjectBackButton"
      class="back-button"
      type="button"
      aria-label="戻る"
    >
      ←
    </button>

    <div class="subject-container">

      <h1
        id="subjectTitle"
        class="screen-title"
      >
      </h1>

      <div class="subject-buttons">

        <!-- 指定された順番 -->

        <button
          class="subject-button"
          data-subject="国語"
        >
          国語
        </button>

        <button
          class="subject-button"
          data-subject="数学"
        >
          数学
        </button>

        <button
          class="subject-button"
          data-subject="社会"
        >
          社会
        </button>

        <button
          class="subject-button"
          data-subject="理科"
        >
          理科
        </button>

        <button
          class="subject-button"
          data-subject="英語"
        >
          英語
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       CHAT
  ========================== -->

  <section id="chatScreen" class="screen">

    <header class="chat-header">

      <button
        id="chatBackButton"
        class="chat-back"
        type="button"
        aria-label="戻る"
      >
        ←
      </button>

      <div class="chat-title-area">

        <div class="chat-title">
          AI学習チャット
        </div>

        <div
          id="chatSubtitle"
          class="chat-subtitle"
        >
        </div>

      </div>

    </header>


    <!-- 写真エリアは上 -->

    <div class="attachment-area">

      <div class="attachment-inner">

        <div
          id="attachmentPreview"
          class="attachment-preview"
        >

          <img
            id="previewImage"
            alt="添付画像"
          >

          <button
            id="removeImageButton"
            class="remove-image"
            type="button"
          >
            写真を外す
          </button>

        </div>


        <div class="attachment-buttons">

          <!-- カメラ -->

          <button
            id="takePhotoButton"
            class="attachment-button"
            type="button"
          >
            写真を撮る
          </button>

          <!-- ファイル -->

          <button
            id="selectPhotoButton"
            class="attachment-button"
            type="button"
          >
            写真を選択
          </button>

          <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
          >

          <input
            id="fileInput"
            type="file"
            accept="image/*"
            hidden
          >

        </div>

      </div>

    </div>


    <!-- チャット -->

    <div class="chat-content">

      <div
        id="messages"
        class="messages"
      >
      </div>

    </div>


    <!-- 質問入力は下 -->

    <div class="composer-area">

      <div class="composer-inner">

        <textarea
          id="questionInput"
          rows="2"
          placeholder="質問を入力…"
        ></textarea>

        <button
          id="sendButton"
          type="button"
        >
          送信
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       CROP
  ========================== -->

  <div
    id="cropModal"
  >

    <div class="crop-container">

      <h2 class="crop-title">
        写真を切り取る
      </h2>

      <div class="crop-stage">

        <img
          id="cropImage"
          alt="切り取り対象"
        >

      </div>

      <div class="crop-actions">

        <button
          id="cancelCropButton"
          class="crop-action"
          type="button"
        >
          キャンセル
        </button>

        <button
          id="useCropButton"
          class="crop-action primary"
          type="button"
        >
          この写真を使う
        </button>

      </div>

    </div>

  </div>


<script>

  /*
   * =====================================================
   * AI学習チャット
   * =====================================================
   *
   * APIキーはここには書かない。
   *
   * ブラウザ
   *   ↓
   * /api/chat
   *   ↓
   * Render Node.js
   *   ↓
   * Groq
   *
   * =====================================================
   */


  const state = {

    mode: null,

    subject: null,

    step: 1,

    messages: [],

    imageData: null,

    answerIds: []

  };


  const startScreen =
    document.getElementById("startScreen");

  const subjectScreen =
    document.getElementById("subjectScreen");

  const chatScreen =
    document.getElementById("chatScreen");


  const subjectTitle =
    document.getElementById("subjectTitle");

  const chatSubtitle =
    document.getElementById("chatSubtitle");

  const messages =
    document.getElementById("messages");

  const questionInput =
    document.getElementById("questionInput");

  const sendButton =
    document.getElementById("sendButton");


  /*
   * =====================================================
   * 画面切り替え
   * =====================================================
   */

  function showScreen(screen) {

    document
      .querySelectorAll(".screen")
      .forEach(element => {

        element.classList.remove("active");

      });

    screen.classList.add("active");

  }


  /*
   * =====================================================
   * 添削 / 質問
   * =====================================================
   */

  document
    .querySelectorAll("[data-mode]")
    .forEach(button => {

      button.addEventListener("click", () => {

        state.mode =
          button.dataset.mode;

        subjectTitle.textContent =
          state.mode;

        showScreen(subjectScreen);

      });

    });


  /*
   * =====================================================
   * 戻る
   * =====================================================
   */

  document
    .getElementById("subjectBackButton")
    .addEventListener("click", () => {

      showScreen(startScreen);

    });


  document
    .getElementById("chatBackButton")
    .addEventListener("click", () => {

      /*
       * 戻るときは現在の学習セッションを破棄。
       */

      resetSession();

      showScreen(subjectScreen);

    });


  /*
   * =====================================================
   * 教科選択
   * =====================================================
   */

  document
    .querySelectorAll("[data-subject]")
    .forEach(button => {

      button.addEventListener("click", () => {

        state.subject =
          button.dataset.subject;

        state.step = 1;

        state.messages = [];

        state.imageData = null;

        state.answerIds = [];

        messages.innerHTML = "";

        questionInput.value = "";

        clearAttachment();

        chatSubtitle.textContent =
          state.subject +
          " ・ " +
          state.mode;

        addAIMessage(
          "問題や質問を送ってね。"
        );

        showScreen(chatScreen);

      });

    });


  /*
   * =====================================================
   * AIメッセージ
   * =====================================================
   */

  function addAIMessage(text) {

    return addMessage(
      text,
      "ai"
    );

  }


  function addUserMessage(text) {

    return addMessage(
      text,
      "user"
    );

  }


  function addMessage(text, type) {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " + type;


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text;


    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    scrollMessages();


    return wrapper;

  }


  /*
   * =====================================================
   * 「・・・」ぽわぽわ
   * =====================================================
   *
   * 文字として「ポワポワ」は表示しない。
   * 3つの点だけをアニメーション。
   */

  function showThinking() {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message ai";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble typing-bubble";


    for (let i = 0; i < 3; i++) {

      const dot =
        document.createElement("span");

      dot.className =
        "typing-dot";

      bubble.appendChild(dot);

    }


    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    scrollMessages();


    return wrapper;

  }


  function scrollMessages() {

    const content =
      document.querySelector(".chat-content");

    content.scrollTop =
      content.scrollHeight;

  }


  /*
   * =====================================================
   * 写真
   * =====================================================
   */

  const cameraInput =
    document.getElementById("cameraInput");

  const fileInput =
    document.getElementById("fileInput");


  document
    .getElementById("takePhotoButton")
    .addEventListener("click", () => {

      cameraInput.click();

    });


  document
    .getElementById("selectPhotoButton")
    .addEventListener("click", () => {

      fileInput.click();

    });


  cameraInput.addEventListener(
    "change",
    event => {

      handleSelectedFile(
        event.target.files[0]
      );

    }
  );


  fileInput.addEventListener(
    "change",
    event => {

      handleSelectedFile(
        event.target.files[0]
      );

    }
  );


  /*
   * =====================================================
   * 写真読み込み
   * =====================================================
   */

  let originalImageData = null;


  function handleSelectedFile(file) {

    if (!file) {
      return;
    }


    if (!file.type.startsWith("image/")) {

      alert("画像を選択してください。");

      return;

    }


    const reader =
      new FileReader();


    reader.onload = () => {

      originalImageData =
        reader.result;

      openCropScreen(
        originalImageData
      );

    };


    reader.readAsDataURL(file);

  }


  /*
   * =====================================================
   * 切り取り画面
   * =====================================================
   *
   * 現在は画像全体を使用する簡易版。
   * 本格的なドラッグ式トリミングは次段階で追加可能。
   */

  const cropModal =
    document.getElementById("cropModal");

  const cropImage =
    document.getElementById("cropImage");


  function openCropScreen(imageData) {

    cropImage.src =
      imageData;

    cropModal.classList.add("show");

  }


  document
    .getElementById("cancelCropButton")
    .addEventListener("click", () => {

      cropModal.classList.remove("show");

      originalImageData = null;

    });


  document
    .getElementById("useCropButton")
    .addEventListener("click", () => {

      if (!originalImageData) {
        return;
      }


      /*
       * 画像を縮小して送信サイズを抑える。
       */

      const image =
        cropImage;


      const canvas =
        document.createElement("canvas");


      const maxSize =
        1600;


      let width =
        image.naturalWidth;

      let height =
        image.naturalHeight;


      const scale =
        Math.min(
          1,
          maxSize / width,
          maxSize / height
        );


      width =
        Math.round(width * scale);

      height =
        Math.round(height * scale);


      canvas.width =
        width;

      canvas.height =
        height;


      const context =
        canvas.getContext("2d");


      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      state.imageData =
        canvas.toDataURL(
          "image/jpeg",
          0.82
        );


      document
        .getElementById("previewImage")
        .src =
        state.imageData;


      document
        .getElementById("attachmentPreview")
        .classList.add("show");


      cropModal.classList.remove("show");

      originalImageData = null;


      /*
       * 重要：
       *
       * questionInput.value は触らない。
       *
       * そのため、写真を撮る前に入力していた
       * 質問内容はそのまま残る。
       */

      questionInput.focus();

    });


  /*
   * =====================================================
   * 写真削除
   * =====================================================
   */

  document
    .getElementById("removeImageButton")
    .addEventListener("click", () => {

      clearAttachment();

    });


  function clearAttachment() {

    state.imageData = null;


    document
      .getElementById("previewImage")
      .removeAttribute("src");


    document
      .getElementById("attachmentPreview")
      .classList.remove("show");


    cameraInput.value = "";

    fileInput.value = "";

  }


  /*
   * =====================================================
   * 送信
   * =====================================================
   */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  questionInput.addEventListener(
    "keydown",
    event => {

      /*
       * Enter
       * → 送信
       *
       * Shift + Enter
       * → 改行
       */

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  async function sendMessage() {

    const text =
      questionInput.value.trim();


    /*
     * 文字も写真もない場合は送信しない。
     */

    if (
      !text &&
      !state.imageData
    ) {

      return;

    }


    /*
     * 生徒側に表示する内容。
     */

    let displayText =
      text;


    if (state.imageData) {

      if (displayText) {

        displayText +=
          "\n\n[写真を添付]";

      } else {

        displayText =
          "[写真を添付]";

      }

    }


    addUserMessage(
      displayText
    );


    /*
     * APIへ渡す会話内容。
     */

    state.messages.push({

      role: "user",

      content:
        text ||
        "添付した写真を確認してください。"

    });


    /*
     * 入力欄だけ空にする。
     *
     * 写真はAI送信完了まで保持。
     */

    questionInput.value = "";


    /*
     * AI待機中
     *
     * 「ポワポワ」という文字は出さない。
     * 3つの点だけ。
     */

    const thinking =
      showThinking();


    sendButton.disabled =
      true;


    try {

      const response =
        await fetch(
          "/api/chat",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                subject:
                  state.subject,

                mode:
                  state.mode,

                step:
                  state.step,

                messages:
                  state.messages,

                imageData:
                  state.imageData

              })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "AIとの通信に失敗しました。"
        );

      }


      /*
       * 「・・・」を削除。
       */

      thinking.remove();


      /*
       * AI回答
       */

      addAIMessage(
        data.answer
      );


      /*
       * 会話を一時保持。
       *
       * ページを閉じれば消える。
       */

      state.messages.push({

        role: "assistant",

        content:
          data.answer

      });


      /*
       * Groq側の回答IDを保持。
       *
       * これは永続保存ではない。
       */

      if (data.id) {

        state.answerIds.push(
          data.id
        );

      }


      /*
       * 最低3段階。
       *
       * 1 → ヒント
       * 2 → 解説
       * 3 → 答え
       *
       * STEP3以降は練習問題フェーズ。
       */

      if (state.step < 3) {

        state.step++;

      }


      /*
       * AIへ送信済みなので
       * 添付画像を一旦外す。
       */

      clearAttachment();


    } catch (error) {

      console.error(
        error
      );


      thinking.remove();


      addAIMessage(
        "ごめん、うまくつながらなかったみたい。\nもう一度送ってみて。"
      );


    } finally {

      sendButton.disabled =
        false;

      questionInput.focus();

    }

  }


  /*
   * =====================================================
   * セッション破棄
   * =====================================================
   *
   * 履歴を保存しない。
   *
   * ページを閉じた場合、
   * このJavaScriptのメモリ上のデータも消える。
   */

  function resetSession() {

    state.mode = null;

    state.subject = null;

    state.step = 1;

    state.messages = [];

    state.imageData = null;

    state.answerIds = [];

    messages.innerHTML = "";

    questionInput.value = "";

    clearAttachment();

  }


  /*
   * ページを離れるときに
   * ブラウザの一時状態も明示的に破棄。
   */

  window.addEventListener(
    "pagehide",
    () => {

      resetSession();

    }
  );

</script>

</body>
</html>
