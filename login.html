<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>ログイン - AI学習チャット</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#172033;font-family:system-ui,"Noto Sans JP",sans-serif}
main{width:min(100%,420px);padding:34px;background:#fff;border:1px solid #e5eaf2;border-radius:20px;box-shadow:0 18px 50px #192d5012}
small{color:#2563eb;font-weight:700;letter-spacing:.12em}h1{margin:12px 0;font-size:27px}p{color:#667085;font-size:14px;line-height:1.8}
label{display:block;margin:24px 0 8px;font-size:13px;font-weight:700}input{width:100%;height:50px;padding:0 14px;border:1px solid #d8dfeb;border-radius:10px;font:inherit}
button{width:100%;height:50px;margin-top:16px;border:0;border-radius:10px;background:#2563eb;color:white;font:inherit;font-weight:700}button:disabled{opacity:.55}
#error{min-height:24px;color:#b42318;font-size:13px}footer{margin-top:22px;color:#98a2b3;font-size:11px;text-align:center}
</style></head><body><main><small>SECURE ACCESS</small><h1>AI学習チャット</h1><p>利用するには、アクセスパスワードを入力してください。</p>
<form id="form"><label for="password">アクセスパスワード</label><input id="password" type="password" autocomplete="current-password" required maxlength="256" autofocus><button id="submit">ログイン</button><p id="error" role="alert" aria-live="polite"></p></form><footer>認証済みの利用者のみアクセスできます。</footer></main>
<script>
const form=document.getElementById("form"),password=document.getElementById("password"),button=document.getElementById("submit"),errorBox=document.getElementById("error");
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="確認中…";errorBox.textContent="";
try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||"ログインできませんでした。");
const next=new URLSearchParams(location.search).get("next")||"/";location.replace(next.startsWith("/")&&!next.startsWith("//")&&!next.includes("\\")?next:"/");
}catch(err){errorBox.textContent=err.message||"通信に失敗しました。";password.select();}finally{button.disabled=false;button.textContent="ログイン";}});
</script></body></html>
